# Integración continua: en cada push y cada PR.
# Bloquea: tests del backend, ruff, tipos, ESLint, tests del frontend y build.
# Solo informa: auditorías de dependencias (no bloquean la rama).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: ruff (reglas laxas, ver backend/ruff.toml)
        run: ruff check .
      - name: pytest
        # conftest.py apunta DATABASE_PATH a un temporal: los tests nunca
        # tocan una base real.
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tipos
        # `tsc -b`, no `tsc --noEmit`: el tsconfig.json raíz solo tiene
        # referencias (`"files": []`), así que `--noEmit` en la raíz no
        # comprueba ningún fichero y pasaría siempre.
        run: npx tsc -b
      - name: ESLint
        run: npm run lint
      - name: tests
        run: npm test
      - name: build
        run: npm run build

  auditoria:
    # Informa de vulnerabilidades conocidas en dependencias, sin bloquear.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
