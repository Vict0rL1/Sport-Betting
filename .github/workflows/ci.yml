# Integración continua (Fase 3.10): secretos, calidad, datos y humo de punta a punta en cada
# push y PR. Los backtests nocturnos van en nightly.yml.
# Máquinas fijadas a ubuntu-24.04: `ubuntu-latest` pasa a Ubuntu 26 desde el 19 de octubre de 2026
# y `playwright install --with-deps` no tiene por qué soportarlo el primer día. Se sube a mano.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks mira el historial del push, no solo el último commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escáner propio (ficheros rastreados)
        run: node scripts/secret-scan.mjs --tracked

  calidad:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Cada script tiene línea de ayuda
        run: npm run help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  datos:
    name: verify:data sobre la base publicada
    runs-on: ubuntu-24.04
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Descargar la historia publicada
        id: datos
        continue-on-error: true
        run: npm run fetch-data
      - name: verify:data
        if: steps.datos.outcome == 'success'
        run: npm run verify:data
      - name: Sin release publicada
        if: steps.datos.outcome != 'success'
        run: echo "No hay release data-latest (o no se pudo bajar); verify:data se salta en esta ejecución."

  e2e:
    name: Humo con Playwright
    runs-on: ubuntu-24.04
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Chromium
        run: npx --workspace web playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      # Fase 7.3: p95 de los endpoints de predicciones y 50 conexiones SSE contra la base de
      # demostración; falla si algo pasa de config/presupuestos.json.
      - name: Prueba de carga con presupuestos
        run: npm run carga:ci
