# Integración continua. Fase 1: escáner de secretos. Las fases siguientes añaden aquí
# tests, lint, typecheck, build, verify:data y Playwright.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks mira el historial del push, no solo el último commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escáner propio (ficheros rastreados)
        run: node scripts/secret-scan.mjs --tracked
