# Uso local con Docker: `docker compose up`. La base vive en el volumen `datos` (history.db +
# ledger.db), como en Fly: la imagen se reemplaza, el volumen no. Variables en el .env.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - datos:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
volumes:
  datos:
